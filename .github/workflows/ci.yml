name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regerar as baselines visuais no Linux (artefato visual-baselines) em vez de comparar'
        type: boolean
        default: false

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run E2E suite
        if: ${{ !inputs.update_snapshots }}
        run: npm run test:e2e
      # Baselines são geradas no Windows; se a rasterização do Linux sair da
      # tolerância (ARCHITECTURE §12), rode o workflow manualmente com
      # update_snapshots=true e versione as imagens do artefato.
      - name: Regenerate visual baselines (Linux)
        if: ${{ inputs.update_snapshots }}
        run: npx playwright test e2e/visual.spec.ts --update-snapshots
      - name: Upload regenerated baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/snapshots/
          retention-days: 14
      - name: Publish HTML report
        if: always()
        run: mkdir -p public/reports && cp -r playwright-report public/reports/playwright
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload published reports (playwright + lighthouse)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-reports
          path: public/reports/
          if-no-files-found: ignore
          retention-days: 14
